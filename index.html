<script>
// 구글 시트 데이터를 불러오는 Apps Script 웹 앱 주소 (배포를 새로 만들면 이 주소만 바꾸세요)
const API='https://script.google.com/macros/s/AKfycbyN0ra0LHrEO0y-Z0LXrqGC4hjElVirv99gEzlcYtgMxGZ8HEh60h6CSjHvF7iFxrE/exec';
const $=s=>document.querySelector(s),T=['출석','출석통계','보고서','심방일지','연락처'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br=s=>esc(s).replace(/\n/g,'<br>');
const tel=(n,l)=>n?`${l?'<small>'+l+')</small> ':''}<a href="tel:${esc(n)}">${esc(n)}</a>`:'';
const cls={'출석':'o','결석':'x'};
// 주일(일요일) 기준: 그 주(일~토) 어느 날을 골라도 해당 주일 날짜로 맞춤
const sun=d=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-t.getUTCDay());return t.toISOString().slice(0,10)};
const addd=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const lbl=d=>(+d.slice(5,7))+'월 '+(+d.slice(8))+'일';
const nowIso=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
// 최근 52주의 주일 목록 (이번 주 주일이 맨 위)
function sunOpts(sel){const c=sun(nowIso());let h='';for(let i=0;i<52;i++){const d=addd(c,-7*i);h+=`<option value="${d}"${d===sel?' selected':''}>${lbl(d)} 주일${i==0?' · 이번 주':''}</option>`}return h}
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2200)}

function chart(p){const W=340,Hh=190,L=32,R=12,T0=16,B=26,iw=W-L-R,ih=Hh-T0-B,n=p.length,x=i=>L+(n>1?iw*i/(n-1):iw/2),y=v=>T0+ih*(1-v/100);
  let s=`<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;background:#fff;border-radius:16px;box-shadow:0 1px 2px #0f172a0a,0 6px 16px #2563eb14">`;
  [0,25,50,75,100].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e5ecf6"/><text x="${L-5}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="#94a3b8">${v}%</text>`});
  const q=p.map((o,i)=>o.r==null?null:[x(i),y(o.r)]).filter(Boolean);
  if(q.length)s+=`<polyline points="${q.map(a=>a.join(',')).join(' ')}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  p.forEach((o,i)=>{if(o.r!=null){s+=`<circle cx="${x(i)}" cy="${y(o.r)}" r="3.5" fill="#2563eb"/>`;if(n<=14)s+=`<text x="${x(i)}" y="${y(o.r)-8}" font-size="9" text-anchor="middle" fill="#1e3a8a" font-weight="700">${o.r}</text>`}
    if(n<=13||i%Math.ceil(n/12)==0)s+=`<text x="${x(i)}" y="${Hh-8}" font-size="9" text-anchor="middle" fill="#94a3b8">${md(o.d)}</text>`});
  return s+'</svg>'}

    $('#l').innerHTML=cmp+chart(p)+`<table><tr><th>주일</th><th>출석</th><th>결석</th><th>출석률</th></tr>`+p.slice().reverse().map(o=>`<tr><td>${md(o.d)}</td><td>${o.a}</td><td>${o.b}</td><td>${o.r==null?'-':o.r+'%'}</td></tr>`).join('')+`</table>`};

const PC={};   // 명단(people)은 자주 안 바뀌므로 2분간 다시 부르지 않음
let VG=0;   // 화면 번호: 탭이나 하위 화면이 바뀔 때마다 1씩 올라감
// bg=true: 화면과 상관없는 배경 요청(로그인 확인·알림 배너 등)은 화면이 바뀌어도 결과를 사용
async function call(a,p,bg){
  const ck=a=='people'?a+JSON.stringify(p||{}):'';if(ck&&PC[ck]&&Date.now()-PC[ck].t<12e4)return PC[ck].d;
  const g=VG;busy(1);
  try{
    let r;
    try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({n:P.n,p:P.p,tk:P.tk,a,params:p||{}})})}
    catch(e){throw new Error('인터넷 연결을 확인해 주세요.')}
    let j;
    try{j=await r.json()}catch(e){throw new Error('서버 응답을 읽을 수 없습니다. 잠시 후 다시 시도해 주세요.')}
    if(!j.ok)throw new Error(j.error||'알 수 없는 오류');
    if(ck)PC[ck]={t:Date.now(),d:j.data};if(WR.test(a)){rcClear();for(const k in PC)delete PC[k]}
    if(!bg&&g!==VG)throw Object.assign(new Error(''),{stale:true});   // 그사이 다른 화면으로 옮겼으면 조용히 버림
    return j.data;
  }finally{busy(-1)}
}
// ===== 빠른 화면 (지난번 내용 먼저 보여주기) =====
// 목록 화면은 기기에 저장해 둔 지난번 내용을 곧바로 그리고, 서버의 최신 내용이 도착하면 달라진 경우에만 다시 그림.
// 무언가를 저장·삭제하면 저장해 둔 내용은 모두 지워서 옛 내용이 보이지 않게 함. 로그아웃하면 기기에서도 지움.
const RC={},SW={},WR=/^(save|nf(Save|AttSave|Del|Done|Undo|Assign)|care(Add|Del|Edit)|rep(Edit|Del)|pinReset)$/;
function rcGet(k){if(RC[k])return RC[k];try{const v=JSON.parse(localStorage.getItem('rc|'+k));if(v&&Date.now()-v.t<864e5)return RC[k]=v}catch(e){}return null}
function rcPut(k,d){const v={t:Date.now(),d};RC[k]=v;try{localStorage.setItem('rc|'+k,JSON.stringify(v))}catch(e){}}
function rcClear(){for(const k in RC)delete RC[k];try{Object.keys(localStorage).filter(k=>k.indexOf('rc|')==0).forEach(k=>localStorage.removeItem(k))}catch(e){}}
async function swr(site,k,get,draw){const g=VG,my=SW[site]=(SW[site]||0)+1,c=rcGet(k);
  if(c)draw(c.d,1);
  let d;try{d=await get(!!c)}catch(e){if(c)return;throw e}   // 지난 내용을 보여주고 있으면 통신 오류는 조용히 넘어감
  if(g!==VG||SW[site]!==my)return;                              // 그사이 다른 화면·다른 조건으로 바뀌었으면 버림
  if(!c||JSON.stringify(c.d)!==JSON.stringify(d)){rcPut(k,d);draw(d,0)}}
// 오류 표시: 화면이 바뀌어 버린 응답은 무시하고, 프로그램 내부 오류(코드 문장)는 사용자에게 보이지 않게 쉬운 말로 바꿈
async function run(f){try{await f()}catch(e){if(e&&e.stale)return;console.error(e);
  alert(e instanceof TypeError||e instanceof ReferenceError||e instanceof RangeError||e instanceof SyntaxError?'화면을 불러오는 중 문제가 생겼어요. 다시 한 번 눌러 주세요.':(e&&e.message)||e)}}

// 임시 PIN(000000)으로 처음 로그인하면 나만의 PIN을 정하게 함
function showSetPin(){$('#login .lc').innerHTML=`<h2>나만의 PIN 정하기</h2><p class="sub">처음 오셨네요! 앞으로 쓸 PIN(숫자 4~6자리)을 정해 주세요.</p><input id="np" type="password" inputmode="numeric" maxlength="6" placeholder="새 PIN (숫자 4~6자리)" autocomplete="new-password"><input id="np2" type="password" inputmode="numeric" maxlength="6" placeholder="새 PIN 한 번 더" autocomplete="new-password"><button class="p" onclick="setPin()">PIN 저장하고 시작하기</button><div id="err" style="color:#d9473f"></div>`;$('#np').focus()}
async function setPin(){const a=$('#np').value.trim(),b=$('#np2').value.trim(),e=$('#err');
  if(!/^\d{4,6}$/.test(a)){e.textContent='PIN은 숫자 4~6자리로 입력해 주세요.';return}
  if(a==='000000'){e.textContent='000000은 사용할 수 없습니다. 다른 숫자로 정해 주세요.';return}
  if(a!==b){e.textContent='두 번 입력한 PIN이 서로 달라요.';return}
  try{await call('setPin',{pin:a});P={n:P.n,p:a};U=await call('login');keep()}catch(x){e.textContent=x.message;return}
  toast('PIN이 저장되었습니다. 다음부터는 새 PIN으로 로그인하세요');enter()}
function enter(){D=sun(nowIso());$('#err').textContent='';$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=U.name+(U.admin?' (관리자)':U.mgr?' (부장)':'');
  // 새친구반만 맡은 선생님(담당 반 없음): 아래 메뉴 없이 새친구 화면(명단·교육출석·등록카드)만 보여줌
  const nfOnly=!U.admin&&!U.mgr&&!U.classes.length&&U.nf&&U.nf.length;
  $('#tabs').style.display=nfOnly?'none':'';
  if(nfOnly){$('#tabs').innerHTML='';tab='새친구';vNf()}
  else{$('#tabs').innerHTML=TT().map(t=>`<button data-t="${t}" onclick="go('${t}')"><span>${ic[t]}</span>${t}</button>`).join('');go('출석')}
  if(U.nf&&U.nf.length)call('nfList',{},1).then(r=>rcPut('nfList',r)).catch(()=>{});   // 새친구 화면을 미리 받아 둠
  if(U.admin||U.mgr)call('week',{date:D},1).then(r=>{rcPut('week|'+D,r);const n=r.list.filter(x=>!x.done).length,b=document.querySelector('[data-t="관리"]');if(b&&n){const e=document.createElement('i');e.className='bd';e.textContent=n;b.appendChild(e)}}).catch(()=>{});
  if(U.admin)call('alerts',{},1).then(a=>{if(!a||!a.length)return;abSet('ab1','<b>🐑 장기결석 알림</b><br>'+a.map(x=>esc(x.label)+' · '+esc(x.name)+' <small>'+esc(x.cls)+'</small>').join('<br>')+'<br><button onclick="ackAl()">확인했어요</button>')}).catch(()=>{});
  if(U.classes.length)call('notices',{},1).then(a=>{if(!a||!a.length)return;abSet('ab2','<b>🌱 우리 반에 새친구가 왔어요!</b><br>'+a.map(x=>esc(x.name)+' <small>'+esc(x.cls)+(x.school?' · '+esc(x.school):'')+(x.grade?' '+esc(x.grade):'')+'</small>').join('<br>')+'<br><small>새친구 교육을 마치고 반에 배정되었어요. 따뜻하게 맞아 주세요 🙏</small><br><button onclick="ackNf()">확인했어요</button>')}).catch(()=>{})}
async function ackAl(){try{await call('alertAck',{},1);abSet('ab1','')}catch(e){toast('처리하지 못했습니다')}}
function logout(){try{if(P&&P.tk)fetch(API,{method:'POST',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({n:P.n,tk:P.tk,a:'logout'})}).catch(()=>{})}catch(e){}
  try{Object.keys(localStorage).filter(k=>k=='au'||k=='uc'||k.indexOf('ld|')==0||k.indexOf('rc|')==0).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}
function go(t){tab=t;VG++;[...$('#tabs').children].forEach(b=>b.className=b.dataset.t==t?'on':'');run({출석:vAtt,출석통계:vStat,보고서:vRep,심방일지:vCare,연락처:vPpl,새친구:vNf,관리:vAdm}[t])}
const opts=a=>a.map(c=>`<option>${esc(c)}</option>`).join('');

// ===== 새친구: 등록카드 · 교육 출석 · 수료 · 반배정 (권한 있는 선생님에게만 탭이 보임) =====
ic['새친구']='<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>';
const NFW=3;   // 새친구 교육 주수
const dots=n=>'●'.repeat(Math.min(n,NFW))+'○'.repeat(Math.max(0,NFW-n));
const nfBu=()=>$('#nb')?$('#nb').value:U.nf[0];
function vNf(){VG++;const m=S.nfm||'명단';
  $('#v').innerHTML=`<div class="seg adm">${['명단','교육출석','등록카드'].map(k=>`<button class="${k==m?'sel':''}" onclick="S.nfm='${k}';S.nfe=null;vNf()">${{명단:'새친구명단',교육출석:'출석체크',등록카드:'등록카드 작성'}[k]}</button>`).join('')}</div>${U.nf.length>1&&m!='등록카드'?`<select id="nb">${opts(['전체',...U.nf])}</select>`:''}<div id="a"></div>`;
  if($('#nb')){if(S.nfb&&(U.nf.includes(S.nfb)||S.nfb=='전체'))$('#nb').value=S.nfb;$('#nb').onchange=()=>{S.nfb=$('#nb').value;vNf()}}
  run({명단:nfList,교육출석:nfAtt,등록카드:()=>nfForm(S.nfe)}[m])}
async function nfList(){const a=$('#a');a.innerHTML='불러오는 중…';
  await swr('nfList','nfList',bg=>call('nfList',{},bg),r=>{const bu=nfBu(),A=r.list.filter(o=>bu=='전체'||o.bu==bu);S.nla=A;S.nall=bu=='전체';nfListDraw()})}
// 위의 숫자 칸을 누르면 그 상태의 새친구만 보임 (전체를 누르면 모두)
function nfListDraw(){const A=S.nla||[],f=S.nfst||'',L=f?A.filter(o=>o.st==f):A,cnt=k=>A.filter(o=>o.st==k).length;S.nl=L;
  const box=(k,c,t,n)=>`<span class="${c}${f==k?' on':''}" onclick="S.nfst='${k}';nfListDraw()"><b${k=='수료'?' style="color:#2563eb"':''}>${n}</b>${t}</span>`;
  $('#a').innerHTML=`<div class="sum nfs">${box('','','전체',A.length)}${box('교육중','a','교육 중',cnt('교육중'))}${box('수료','','수료',cnt('수료'))}${box('배정완료','c','배정 완료',cnt('배정완료'))}</div>`+
   `<button class="p" onclick="S.nfm='등록카드';S.nfe=null;vNf()">+ 새친구 등록</button>`+(L.length?L.map(nfCard).join(''):`<p>${f?esc(f)+' 상태인 새친구가 없습니다.':'등록된 새친구가 없습니다.'}</p>`)}
function nfCard(o,i){const cs=U.classes.filter(x=>x.bu==o.bu).map(x=>x.name),sc={'교육중':'','수료':' s2','배정완료':' s3'}[o.st]||'';
  return `<div class="card"><b>${esc(o.name)}</b> <small>${S.nall?esc(o.bu)+' · ':''}${esc(o.school||'')} ${esc(o.grade||'')}</small> <span class="nst${sc}">${esc(o.st)}</span>${o.tch?`<span class="nst tc" style="background:${tcCol(o.tch)}">${esc(o.tch)}</span>`:''}`+
   `<p><small>교육 ${dots(o.n)} ${o.n}/${NFW}주 · 등록 ${esc(md(o.reg))}${o.guide?' · 인도 '+esc(o.guide):''}</small></p>`+
   (o.st=='배정완료'?`<p><small>✅ ${esc(o.cls)} 배정${o.asg?' ('+esc(md(o.asg))+')':''}</small></p>`:'')+
   (o.note?`<p class="nnote">📝 ${esc(o.note)}</p>`:'')+
   `<p><button class="vb" onclick="S.nfm='등록카드';S.nfe='${esc(o.id)}';vNf()">상세정보 보기·수정</button>`+
   (o.st=='교육중'&&o.n>=NFW?`<button class="vb" onclick="nfDone(${i})">수료 처리</button>`:'')+
   (o.st=='수료'&&U.admin?`<button class="vb dl" onclick="nfUndo(${i})">수료 취소</button>`:'')+'</p>'+
   (o.st=='수료'&&U.admin?`<div class="bar"><select id="ac${i}"><option value="">배정할 반 선택</option>${opts(cs)}</select><button class="vb" onclick="nfAsg(${i})">반배정</button></div>`:'')+
   (o.st=='수료'&&!U.admin?'<p><small>관리자가 반을 배정하면 그 반 선생님께 알림이 갑니다.</small></p>':'')+'</div>'}
// 담당교사 색: 이름마다 늘 같은 색 (상태 색인 초록·파랑·회색과 겹치지 않게)
const TCC=['#f97316','#8b5cf6','#db2777','#0d9488','#ca8a04','#4f46e5','#dc2626','#0891b2'];
function tcCol(n){let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%9973;return TCC[h%TCC.length]}
function nfTchOpts(){const e=$('#nf_담당교사');if(!e)return;const bu=$('#nf_bu')?$('#nf_bu').value:(S.nr.bu||U.nf[0]),L=((S.ntch||{})[bu]||[]).slice(),cur=L.includes(e.value)?e.value:(e.dataset.v||'');
  if(cur&&!L.includes(cur))L.push(cur);e.innerHTML=`<option value="">선택</option>`+L.map(x=>`<option${x==cur?' selected':''}>${esc(x)}</option>`).join('')}
function nfDone(i){const o=S.nl[i];if(!confirm(o.name+' 새친구를 수료 처리할까요?'))return;run(async()=>{await call('nfDone',{id:o.id});toast('수료 처리되었습니다');nfList()})}
function nfUndo(i){const o=S.nl[i];if(!confirm(o.name+' 새친구의 수료를 취소할까요?'))return;run(async()=>{await call('nfUndo',{id:o.id});toast('취소되었습니다');nfList()})}
function nfAsg(i){const o=S.nl[i],c=$('#ac'+i).value;if(!c){alert('배정할 반을 골라 주세요.');return}
  if(!confirm(o.name+' 새친구를 '+c+' 반에 배정할까요?\n출석부 명단에 추가되고, 그 반 선생님께 알림이 갑니다.'))return;
  run(async()=>{await call('nfAssign',{id:o.id,cls:c});toast(c+' 반에 배정되었습니다');nfList()})}

async function nfAtt(){$('#a').innerHTML=`<div class="wk"><select id="d">${sunOpts(D)}</select></div><div id="l">불러오는 중…</div>`;
  const ld=()=>run(async()=>{$('#l').innerHTML='불러오는 중…';const bus=nfBu()=='전체'?U.nf:[nfBu()],dt=$('#d').value;S.ntouch=false;
    await swr('nfAtt','nfAtt|'+dt+'|'+bus.join(','),bg=>Promise.all(bus.map(b=>call('nfAtt',{date:dt,bu:b},bg))),rs=>{if(S.ntouch)return;   // 체크를 시작했으면 최신 내용이 와도 덮어쓰지 않음
    S.nab=bus.length>1;S.na=[].concat(...rs.map((r,i)=>r.list.map(o=>Object.assign({},o,{bu:bus[i]}))));S.nst={};S.na.forEach(o=>S.nst[o.id]=o.st=='출석'?'출석':'');S.nst0=Object.assign({},S.nst);nfAttDraw()})});
  $('#d').onchange=ld;ld()}
function nfAttDraw(){const L=S.na;
  $('#l').innerHTML=L.length?L.map(o=>`<div class="row"><b class="nm">${S.nab?`<small class="gr">${esc(o.bu)}</small>`:''}${o.tch?`<small class="gr" style="background:${tcCol(o.tch)};color:#fff">${esc(o.tch)}</small>`:''}${esc(o.name)}<small class="ls">교육 ${dots(o.n)} ${o.n}/${NFW}</small></b><span class="seg"><button class="${S.nst[o.id]=='출석'?'o':''}" onclick="S.ntouch=true;S.nst['${esc(o.id)}']=S.nst['${esc(o.id)}']=='출석'?'':'출석';nfAttDraw()">교육출석</button></span></div>`).join('')+
   `<button class="p" onclick="run(nfAttSave)">저장 (교육출석 ${L.filter(o=>S.nst[o.id]=='출석').length}명)</button><p><small>온 새친구만 '교육출석'을 눌러 주세요. 한 번 더 누르면 취소돼요. ${NFW}주를 모두 출석하면 새친구명단에서 수료 처리할 수 있어요.</small></p>`:'<p>교육 중인 새친구가 없습니다.</p>'}
async function nfAttSave(){const st={};S.na.forEach(o=>{if(S.nst[o.id]=='출석')st[o.id]='출석';else if((S.nst0||{})[o.id]=='출석')st[o.id]='결석'});   // 결석은 따로 체크하지 않음: 출석을 취소한 사람만 지움
  if(!Object.keys(st).length)throw new Error('교육출석을 먼저 눌러 주세요.');
  const by={};S.na.forEach(o=>{if(st[o.id])(by[o.bu]=by[o.bu]||{})[o.id]=st[o.id]});
  let done=[];for(const b of Object.keys(by)){const r=await call('nfAttSave',{date:$('#d').value,bu:b,status:by[b]});if(r&&r.done)done=done.concat(r.done)}
  if(done.length)alert(`🎉 ${done.join(', ')} 새친구가 교육 ${NFW}주를 모두 마쳐 수료되었어요.\n이제 출석체크에서는 빠지고, 새친구명단 맨 위에서 반배정을 기다려요.`);else toast('저장되었습니다');nfAtt()}

// 등록카드: 글씨 칸(사진에서 자동으로 읽음)과 동그라미 칸(버튼으로 고름)
const NFF=[['이름','이름'],['생년월일','생년월일','date'],['학년','학년','sel',['','1학년','2학년','3학년']],['학교','소속학교'],['학생연락처','본인 번호','tel'],['보호자연락처','부모 번호','tel'],['주소','주소'],['이전교회','이전교회'],['인도자','인도자 (이름·관계)']];
const NFC=[['성별',['남','여']],['신앙생활',['방문','등록','기타']],['신급',['세례','입교','학습','유아세례','없음']],['부모연락동의',['예','아니오'],'부모님께 전화(문자)해도 괜찮나요?'],['예배참여',['예','아니오'],'예배에 꾸준히 참여할 생각이 있나요?'],['개인정보동의',['예','아니오'],'개인정보 수집 및 제공에 동의하나요?']];
async function nfForm(id){$('#a').innerHTML='불러오는 중…';
  const [r,t]=await Promise.all([id?call('nfGet',{id}):{fam:[],'등록신청일':nowIso()},S.ntch?S.ntch:call('nfTch').catch(()=>({}))]);S.ntch=t&&Object.keys(t).length?t:null;S.nr=r;S.nph='';S.nun=[];S.ncv={};NFC.forEach(([k])=>S.ncv[k]=r[k]||'');nfDraw()}
const nfFam=f=>`<div class="fam"><div class="bar"><input placeholder="관계" class="fr" value="${esc(f.rel||'')}"><input placeholder="이름" class="fn" value="${esc(f.name||'')}"></div><div class="bar"><input placeholder="생년월일" class="fb" value="${esc(f.birth||'')}"><input placeholder="전화번호" class="ft" type="tel" value="${esc(f.tel||'')}"></div><div class="bar"><input placeholder="직분" class="fo" value="${esc(f.role||'')}"><input placeholder="섬기는 교회" class="fc" value="${esc(f.church||'')}"></div></div>`;
function nfDraw(){const r=S.nr,ro=r.st=='배정완료'&&!U.admin;
  $('#a').innerHTML=`<div class="card"><b>${r.id?esc(r['이름'])+' 등록카드':'새 등록카드'}</b>${r.id?` <small>${esc(r.st)}${r.days&&r.days.length?' · 교육 '+r.days.length+'/'+NFW+'주':''}${r.photo?' · 사진 보관됨':''}</small>`:''}`+
   (r.id?'':`<label class="p nfcam">📷 등록카드 사진으로 채우기<input type="file" accept="image/*" hidden onchange="nfPic(this)"></label><p class="nfl" id="ocm">카드를 평평한 곳에 두고, 카드 한 장만 화면에 가득 차게 위에서 찍어 주세요. 글씨를 읽어 칸을 채워 드려요. (사진은 저장하지 않아요)</p>`)+
   (U.nf.length>1?`<label class="nfl">부서</label><select id="nf_bu">${opts(U.nf)}</select>`:'')+
   `<label class="nfl">담당교사</label><select id="nf_담당교사" data-v="${esc(r['담당교사']||'')}"></select>`+
   NFF.map(([k,l,t,o])=>`<label class="nfl">${l}</label>`+(t=='sel'?`<select id="nf_${k}">${o.map(x=>`<option value="${x}"${(r[k]||'')==x?' selected':''}>${x||'선택'}</option>`).join('')}</select>`:`<input id="nf_${k}" ${t=='date'?'type="date"':t=='tel'?'type="tel" inputmode="tel"':''} value="${esc(r[k]||'')}">`)).join('')+
   NFC.map(([k,o,l])=>`<label class="nfl">${l||k}</label><span class="seg nfc">${o.map(x=>`<button type="button" class="${S.ncv[k]==x?'o':''}" onclick="nfPick(this,'${k}','${x}')">${x}</button>`).join('')}</span>`).join('')+
   `<label class="nfl">가족 관계</label><div id="fams">${(r.fam&&r.fam.length?r.fam:[{}]).map(nfFam).join('')}</div><button class="vb" onclick="nfFamAdd()">+ 가족 추가</button>`+
   `<label class="nfl">특이사항 (선생님이 직접 입력)</label><textarea id="nf_특이사항" rows="3" placeholder="예) 친구 ○○가 전도함, 가정 상황 등">${esc(r['특이사항']||'')}</textarea>`+
   `<label class="nfl">등록신청일</label><input id="nf_등록신청일" type="date" value="${esc(r['등록신청일']||nowIso())}">`+
   (ro?'<p><small>반배정이 끝난 카드는 관리자만 고칠 수 있어요.</small></p>':`<button class="p" onclick="run(nfSave)">저장</button>`)+
   (r.id?`<p><button class="vb" onclick="S.nfm='명단';vNf()">← 목록으로</button>${U.admin||r.st=='교육중'?`<button class="vb dl" onclick="nfDel()">삭제</button>`:''}</p>`:'')+'</div>';
  if($('#nf_bu')){$('#nf_bu').value=r.bu||(U.nf.includes(S.nfb)?S.nfb:U.nf[0]);$('#nf_bu').onchange=nfTchOpts}

  const foot = W.filter(w => w.v > hv + 60 && /드림|공동체|부모님|개인정보|등록신청일|괜찮|참여/.test(w.t)).reduce((m, w) => Math.min(m, w.v), hv + 800);
  const T = W.filter(w => !labelWords.has(w) && w.v > hv + 55 && w.v < foot - 25 && w.u > colU.rel - 120 && w.u < colU.church + 220 && !/^(가족|관계|이름|생년월일|교회)$/.test(w.t));
  const colOf = w => { let k = 'rel', bd = Infinity; const num = /^[\d\-.\/?()]+$/.test(w.t);   // 숫자 조각은 생년월일·전화번호 칸에만
    Object.keys(colU).filter(c => !num || c === 'birth' || c === 'tel').forEach(c => { const d = Math.abs(w.u - colU[c]); if (d < bd) { bd = d; k = c; } }); return k; };
  T.forEach(w => w.col = colOf(w));
  const seeds = T.filter(w => w.col === 'rel' || w.col === 'name').map(w => w.v).sort((a, b) => a - b), rows = [];
  seeds.forEach(v => { const g = rows[rows.length - 1]; if (g && v - g.v1 < 60) { g.v1 = v; g.s.push(v); } else rows.push({ v1: v, s: [v] }); });
  rows.forEach(g => g.c = g.s.reduce((a, b) => a + b, 0) / g.s.length);
  rows.forEach(g => {
    const e = {};
    T.filter(w => { let bi = -1, bd = Infinity; rows.forEach((h, i) => { const d = Math.abs(w.v - h.c); if (d < bd) { bd = d; bi = i; } }); return rows[bi] === g && bd < 85; })
      .sort((p, q) => (Math.abs(p.v - q.v) > 25 ? p.v - q.v : p.u - q.u)).forEach(w => { e[w.col] = ((e[w.col] || '') + (w.col === 'tel' || w.col === 'birth' ? '' : ' ') + w.t).trim(); });
    if (e.tel) { const t = tel(e.tel); e.tel = t ? fixTel(t) : e.tel; }
    if (e.rel) { const ws = e.rel.split(/\s+/), ri = ws.findIndex(x => REL.test(x));   // '자매 전' + '은율' → 관계 '자매', 이름 '전은율'
      if (ri >= 0 && ws.length > 1) { e.name = ws.filter((x, i) => i !== ri).join('') + (e.name || ''); e.rel = ws[ri]; } }
    if (!(e.rel && REL.test(e.rel)) && !(e.name && /^[가-힣]{2,4}$/.test(e.name.replace(/\s+/g, '')))) return;   // 관계도 이름도 아닌 줄(안내문 등)은 버림
    if (e.church && /^[xX×]$/.test(e.church)) e.church = '';
    if (e.name) e.name = e.name.replace(/\s+/g, '');
    if (e.rel || e.name) f.fam.push({ rel: e.rel || '', name: e.name || '', birth: e.birth || '', tel: e.tel || '', role: e.role || '', church: (e.church || '').replace(/\s+/g, '') });
  });
  ['name', 'tel', 'ptel', 'school'].forEach(k => { if (!f[k]) f.unsure.push({ name: '이름', tel: '학생연락처', ptel: '보호자연락처', school: '학교' }[k]); });
  return f;
}

    .map(o=>`<div class="row"><div><b>${esc(o.name)}</b> <small>${esc(o.cls)} ${esc(o.grade)}</small><br><small>${o.school?esc(o.school)+' · ':''}${o.birth?'생일 '+(+String(o.birth).slice(5,7))+'월 '+(+String(o.birth).slice(8,10))+'일 ':''}${esc(o.note)}</small><br>${tel(o.tel,'본인')} ${tel(o.ptel,'부모')}</div></div>`).join('')||'<p>해당하는 학생이 없습니다.</p>'};
  const load=()=>run(async()=>{const bu=buVal();await swr('people','people|'+bu,bg=>call('people',{bu},bg),d=>{a=d;
    const cur=$('#sc').value,ss=[...new Set(a.map(o=>String(o.school||'').trim()).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'ko'));
    $('#sc').innerHTML='<option value="">전체 학교</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('')+(a.some(o=>!o.school)?'<option value="__none">학교 미입력</option>':'');
    $('#sc').value=cur;if($('#sc').value!==cur)$('#sc').value='';f()})});
  if(multi())$('#bu').onchange=load;
  $('#q').oninput=$('#b').onchange=$('#sc').onchange=f;load()}

// 저장해 둔 로그인 정보가 있으면 서버 확인을 기다리지 않고 바로 화면을 띄움 (확인은 뒤에서 진행)
function fast(s){let c=null;try{c=JSON.parse(localStorage.getItem('uc'))}catch(e){}
  if(!c||!c.classes){if(s.p){$('#p').value=s.p;login()}else if(s.tk){P=s;call('login',{},1).then(u=>{U=u;keep();enter()}).catch(()=>{})}return}
  P=s;U=c;enter();
  call('login',{},1).then(u=>{if(u.must){logout();return}U=u;keep()}).catch(e=>{if(/PIN/.test(e.message))logout()})}   // 예전 방식(PIN 저장)으로 로그인해 있던 기기는 여기서 자동으로 열쇠 방식으로 바뀜
try{const s=JSON.parse(localStorage.getItem('au'));if(s){$('#n').value=s.n;fast(s)}}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
