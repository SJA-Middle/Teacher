<script>
// 구글 시트 데이터를 불러오는 Apps Script 웹 앱 주소 (배포를 새로 만들면 이 주소만 바꾸세요)
const API='https://script.google.com/macros/s/AKfycbyN0ra0LHrEO0y-Z0LXrqGC4hjElVirv99gEzlcYtgMxGZ8HEh60h6CSjHvF7iFxrE/exec';
const $=s=>document.querySelector(s),T=['출석','출석통계','보고서','심방일지','연락처'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br=s=>esc(s).replace(/\n/g,'<br>');
const tel=(n,l)=>n?`${l?'<small>'+l+')</small> ':''}<a href="tel:${esc(n)}">${esc(n)}</a>`:'';
const cls={'출석':'o','결석':'x'};
// 주일(일요일) 기준: 그 주(일~토) 어느 날을 골라도 해당 주일 날짜로 맞춤
const sun=d=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-t.getUTCDay());return t.toISOString().slice(0,10)};
const addd=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const lbl=d=>(+d.slice(5,7))+'월 '+(+d.slice(8))+'일';
const nowIso=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
// 최근 52주의 주일 목록 (이번 주 주일이 맨 위)
function sunOpts(sel){const c=sun(nowIso());let h='';for(let i=0;i<52;i++){const d=addd(c,-7*i);h+=`<option value="${d}"${d===sel?' selected':''}>${lbl(d)} 주일${i==0?' · 이번 주':''}</option>`}return h}
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2200)}
const ic={'출석':'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>','출석통계':'<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>','보고서':'<svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>','심방일지':'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>','연락처':'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>'};

// ===== 관리자 전용 메뉴 =====
const TT=()=>{const t=[...T];if(U.nf&&U.nf.length)t.push('새친구');if(U.admin||U.mgr)t.push('관리');return t};
ic['관리']='<svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 7.7 8 9 4.6-1.3 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>';

function chart(p){const W=340,Hh=190,L=32,R=12,T0=16,B=26,iw=W-L-R,ih=Hh-T0-B,n=p.length,x=i=>L+(n>1?iw*i/(n-1):iw/2),y=v=>T0+ih*(1-v/100);
  let s=`<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;background:#fff;border-radius:16px;box-shadow:0 1px 2px #0f172a0a,0 6px 16px #2563eb14">`;
  [0,25,50,75,100].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e5ecf6"/><text x="${L-5}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="#94a3b8">${v}%</text>`});
  const q=p.map((o,i)=>o.r==null?null:[x(i),y(o.r)]).filter(Boolean);
  if(q.length)s+=`<polyline points="${q.map(a=>a.join(',')).join(' ')}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  p.forEach((o,i)=>{if(o.r!=null){s+=`<circle cx="${x(i)}" cy="${y(o.r)}" r="3.5" fill="#2563eb"/>`;if(n<=14)s+=`<text x="${x(i)}" y="${y(o.r)-8}" font-size="9" text-anchor="middle" fill="#1e3a8a" font-weight="700">${o.r}</text>`}
    if(n<=13||i%Math.ceil(n/12)==0)s+=`<text x="${x(i)}" y="${Hh-8}" font-size="9" text-anchor="middle" fill="#94a3b8">${md(o.d)}</text>`});
  return s+'</svg>'}

async function call(a,p){
  const ck=a=='people'?a+JSON.stringify(p||{}):'';if(ck&&PC[ck]&&Date.now()-PC[ck].t<12e4)return PC[ck].d;
  busy(1);

    try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({n:P.n,p:P.p,tk:P.tk,a,params:p||{}})})}
    catch(e){throw new Error('인터넷 연결을 확인해 주세요.')}
    let j;
    try{j=await r.json()}catch(e){throw new Error('서버 응답을 읽을 수 없습니다. 잠시 후 다시 시도해 주세요.')}
    if(!j.ok)throw new Error(j.error||'알 수 없는 오류');

function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85))};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('사진을 열 수 없습니다. 다시 찍어 주세요.'))};im.src=u})}

  const fill=()=>{$('#c').innerHTML=opts(['전체',...clsFor(buVal())])};fill();
  const f=()=>run(async()=>{const a=await call('stats',{month:$('#m').value,bu:buVal(),cls:$('#c').value});
    $('#l').innerHTML=(a.length?`<table><tr><th>이름</th><th>반</th><th>출석</th><th>결석</th><th>출석률</th></tr>`+
    a.map(o=>`<tr class="go" onclick="run(()=>vStu('${o.id}'))"><td>${esc(o.name)}</td><td>${esc(o.cls)}</td><td>${o['출석']}</td><td>${o['결석']}</td><td>${o.rate==null?'-':o.rate+'%<div class="meter"><i style="width:'+o.rate+'%"></i></div>'}</td></tr>`).join('')+`</table><p><small>이름을 누르면 학생 개인별 출석 기록을 볼 수 있어요.</small></p>`:'<p>학생이 없습니다.</p>')});
  if(multi())$('#bu').onchange=()=>{fill();f()};
  $('#m').onchange=$('#c').onchange=f;f()}
async function vStu(id){
  const o=await call('student',{id});
  $('#v').innerHTML=`<a class="back" href="#" onclick="go('출석통계');return false">← 출석통계로</a><div class="card"><b>${esc(o.name)}</b> <small>${esc(o.cls)} ${esc(o.grade)} ${esc(o.school)}</small>
   <p>출석 ${o.sum['출석']} · 결석 ${o.sum['결석']}</p></div>`+
   (o.recs.length?o.recs.map(r=>`<div class="row"><div>${esc(r.date)}</div><span class="tag ${cls[r.status]||''}">${esc(r.status)}</span>${r.reason?`<small style="flex-basis:100%;margin-top:4px">사유: ${esc(r.reason)}</small>`:''}</div>`).join(''):'<p>출석 기록이 없습니다.</p>')}

function repEd(i){const o=S.rp[i];const el=document.querySelectorAll('#l .card')[i];
  el.innerHTML=`<b>${lbl(sun(String(o.date).slice(0,10)))} 주일</b> <small>${esc(o.cls)}</small><textarea id="ep" rows="3" placeholder="기도제목">${esc(o.prayer)}</textarea><textarea id="en" rows="3" placeholder="반 특이사항">${esc(o.note)}</textarea><p><button class="vb" onclick="repSv(${i})">저장</button><button class="vb dl" onclick="vRep()">취소</button></p>`}
async function repSv(i){const o=S.rp[i];run(async()=>{await call('repEdit',{date:String(o.date).slice(0,10),cls:o.cls,prayer:$('#ep').value,note:$('#en').value});toast('수정되었습니다');vRep()})}
async function repDl(i){const o=S.rp[i];if(!confirm(o.cls+' '+lbl(sun(String(o.date).slice(0,10)))+' 주일 보고서를 삭제할까요?\n(출석 기록은 그대로 남습니다)'))return;
  run(async()=>{await call('repDel',{date:String(o.date).slice(0,10),cls:o.cls});toast('삭제되었습니다');vRep()})}
async function vRep(){
  const cur=sun(nowIso());
  $('#v').innerHTML=`<select id="w" style="text-align:center;text-align-last:center;font-weight:700;color:#1d4a94;padding:12px"><option value="r4">최근 4주 모아보기</option>${sunOpts(cur)}</select>${buSel(true)}<select id="c"></select>${U.admin||U.mgr?'<select id="m"><option value="">전체 내용</option><option value="p">기도제목만 모아보기</option><option value="n">특이사항만 모아보기</option></select>':''}<div id="l">불러오는 중…</div>`;
  const fill=()=>{$('#c').innerHTML=opts(['전체',...clsFor(buVal())])};fill();
  const f=()=>run(async()=>{let a=await call('reports',{...(w=>w=='r4'?{from:addd(cur,-21),to:addd(cur,6)}:{from:w,to:addd(w,6)})($('#w').value),bu:buVal(),cls:$('#c').value});
    const md_=(U.admin||U.mgr)&&$('#m')?$('#m').value:'';if(md_)a=a.filter(o=>md_=='p'?o.prayer:o.note);
    S.rp=a;$('#l').innerHTML=a.length?a.map((o,i)=>md_?`<div class="card"><b>${lbl(sun(String(o.date).slice(0,10)))} 주일</b> <small>${esc(o.cls)}${o.by?' · '+esc(o.by):''}</small><p>${br(md_=='p'?o.prayer:o.note)}</p></div>`:`<div class="card"><b>${lbl(sun(String(o.date).slice(0,10)))} 주일</b> <small>${esc(o.cls)}${o.by?' · '+esc(o.by):''}</small>`+
      (o.att?`<p><small>출석 ${o.att['출석']} · 결석 ${o.att['결석']}</small></p>`:'')+
      (o.absent&&o.absent.length?`<p><b>결석</b> ${o.absent.map(a=>esc(a.name)+(a.reason?` (${esc(a.reason)})`:'')).join(', ')}</p>`:'')+
      (o.prayer?`<p><b>기도제목</b><br>${br(o.prayer)}</p>`:'')+(o.note?`<p><b>특이사항</b><br>${br(o.note)}</p>`:'')+
      (!o.prayer&&!o.note?'<p><small>작성된 내용이 없습니다.</small></p>':'')+(canEd(o)?`<p><button class="vb" onclick="repEd(${i})">수정</button><button class="vb dl" onclick="repDl(${i})">삭제</button></p>`:'')+`</div>`).join(''):'<p>해당 기간에 기록된 보고서가 없습니다.</p>'});
  if(multi())$('#bu').onchange=()=>{fill();f()};
  $('#w').value=cur;$('#w').onchange=$('#c').onchange=f;if($('#m'))$('#m').onchange=f;f()}

async function vCare(){$('#v').innerHTML=`<div class="card"><b>심방일지</b><input id="vq" placeholder="학생 이름 검색"><select id="vs"></select><input type="date" id="vd" value="${nowIso()}"><textarea id="vn" rows="3" placeholder="심방 내용 (방문·통화·만남 등) — 쓰려면 위에서 학생을 선택하세요"></textarea><button class="p" onclick="run(visitSave)">저장</button></div><div id="l">불러오는 중…</div>`;
  run(async()=>{const [pp,lg]=await Promise.all([call('people',{bu:'전체'}),call('careLog',{})]);S.pp=pp;S.lg=lg;
    const fl=()=>{const q=$('#vq').value.trim(),cur=S.vf||'';$('#vs').innerHTML='<option value="">전체 학생 (최신순)</option>'+pp.filter(o=>(!q||String(o.name).includes(q))||String(o.id)===cur).slice(0,80).map(o=>`<option value="${esc(o.id)}">${esc(o.name)} · ${esc(o.cls)}</option>`).join('');$('#vs').value=cur};
    fl();$('#vq').oninput=fl;$('#vs').onchange=()=>{S.vf=$('#vs').value;carePaint()};carePaint()})}
function carePaint(){const id=S.vf||'',lg=S.lg;let n=0;
  const h=lg.map((o,i)=>String(o.id)===id||!id?(n++,`<div class="row"><div><b class="pn" onclick="S.vf='${esc(o.id)}';$('#vs').value=S.vf;carePaint()">${esc(o.name)}</b> <small>${esc(o.cls)} · ${lbl(o.date)}${o.by?' · '+esc(o.by):''}</small><br>${br(o.note)}${canEd(o)?`<br><button class="vb" onclick="careEd(${i})">수정</button><button class="vb dl" onclick="careDl(${i})">삭제</button>`:''}</div></div>`):'').join('');
  $('#l').innerHTML=n?h:(id?'<p>이 학생의 심방일지가 아직 없습니다.</p>':'<p>아직 심방일지가 없습니다.</p>')}
const canEd=o=>U.admin||(o.by&&o.by===U.name);
async function careEd(i){const o=S.lg[i],n=prompt('심방 내용을 수정해 주세요',o.note);if(n==null||!n.trim())return;
  run(async()=>{await call('careEdit',{id:o.id,at:o.at,note:n});toast('수정되었습니다');vCare()})}
async function careDl(i){const o=S.lg[i];if(!confirm(o.name+' 학생의 '+lbl(o.date)+' 심방일지를 삭제할까요?'))return;
  run(async()=>{await call('careDel',{id:o.id,at:o.at});toast('삭제되었습니다');vCare()})}

async function vPpl(){
  $('#v').innerHTML=`${buSel(true)}<select id="sc"><option value="">전체 학교</option></select><input id="q" placeholder="이름 또는 학교 검색"><label><input type="checkbox" id="b" style="width:auto"> 이번 달 생일만</label><div id="l">불러오는 중…</div>`;
  const mo=nowIso().slice(5,7);let a=[];
  const f=()=>{const q=$('#q').value.trim(),b=$('#b').checked,sc=$('#sc').value;
    $('#l').innerHTML=a.filter(o=>(!q||String(o.name).includes(q)||String(o.school).includes(q))&&(!sc||(sc=='__none'?!o.school:o.school==sc))&&(!b||String(o.birth).slice(5,7)==mo))
    .sort((x,y)=>b?String(x.birth).slice(8)-String(y.birth).slice(8):0)
    .map(o=>`<div class="row"><div><b>${esc(o.name)}</b> <small>${esc(o.cls)} ${esc(o.grade)}</small><br><small>${o.school?esc(o.school)+' · ':''}${o.birth?'생일 '+(+String(o.birth).slice(5,7))+'월 '+(+String(o.birth).slice(8,10))+'일 ':''}${esc(o.note)}</small><br>${tel(o.tel,'본인')} ${tel(o.ptel,'부모')}</div></div>`).join('')||'<p>해당하는 학생이 없습니다.</p>'};
  const load=()=>run(async()=>{a=await call('people',{bu:buVal()});
    const cur=$('#sc').value,ss=[...new Set(a.map(o=>String(o.school||'').trim()).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'ko'));
    $('#sc').innerHTML='<option value="">전체 학교</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('')+(a.some(o=>!o.school)?'<option value="__none">학교 미입력</option>':'');
    $('#sc').value=cur;if($('#sc').value!==cur)$('#sc').value='';f()});
  if(multi())$('#bu').onchange=load;
  $('#q').oninput=$('#b').onchange=$('#sc').onchange=f;load()}

// 저장해 둔 로그인 정보가 있으면 서버 확인을 기다리지 않고 바로 화면을 띄움 (확인은 뒤에서 진행)
function fast(s){let c=null;try{c=JSON.parse(localStorage.getItem('uc'))}catch(e){}
  if(!c||!c.classes){if(s.p){$('#p').value=s.p;login()}else if(s.tk){P=s;call('login').then(u=>{U=u;keep();enter()}).catch(()=>{})}return}
  P=s;U=c;enter();
  call('login').then(u=>{if(u.must){logout();return}U=u;keep()}).catch(e=>{if(/PIN/.test(e.message))logout()})}   // 예전 방식(PIN 저장)으로 로그인해 있던 기기는 여기서 자동으로 열쇠 방식으로 바뀜
try{const s=JSON.parse(localStorage.getItem('au'));if(s){$('#n').value=s.n;fast(s)}}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
